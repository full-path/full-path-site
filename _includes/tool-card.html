{% assign tool = include.tool %}
<div class="project-card" data-category="{{ tool.category | downcase }}">
  {% if tool.category %}
  <div class="project-card__meta">
    <span class="tool-category tool-category--{{ tool.category | downcase }}">{{ tool.category }}</span>
  </div>
  {% endif %}
  <h3>{{ tool.title }}</h3>
  <p>{{ tool.description }}</p>
  <a href="{{ tool.permalink | relative_url }}" class="btn btn--primary btn--small"{% if tool.newtab %} target="_blank" rel="noopener"{% endif %}>{{ tool.cta | default: "Learn more" }}</a>
</div>
