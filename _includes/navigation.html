<nav class="site-nav">
  <div class="site-nav__inner">
    <a class="site-nav__logo" href="{{ '/' | relative_url }}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68.79 68.79" width="40" height="40" aria-hidden="true">
        <g transform="translate(0,-228.20832)">
          <g transform="matrix(6.0121393,0,0,6.0032807,-197.74654,14.028293)">
            <circle cx="38.629166" cy="41.412498" r="5.7150002" fill="#b12d00"/>
            <text x="34.126907" y="44.173866" style="font-weight:700;font-size:7.76px;font-family:Raleway,sans-serif;fill:#ffffff;">FP</text>
          </g>
        </g>
      </svg>
      <span>{{ site.title }}</span>
    </a>
    <button class="site-nav__toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="site-nav__links">
      {% for link in site.data.navigation.main %}
        <li>
          {% if forloop.last %}
            <a href="{{ link.url | relative_url }}" class="btn btn--primary btn--small">{{ link.title }}</a>
          {% else %}
            {% assign is_active = false %}
            {% if page.url == link.url or page.url contains link.url %}
              {% assign is_active = true %}
            {% endif %}
            <a href="{{ link.url | relative_url }}"{% if is_active %} class="is-active" aria-current="page"{% endif %}>{{ link.title }}</a>
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  </div>
</nav>
