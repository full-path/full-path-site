<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <span class="site-footer__brand-name">{{ site.name }}</span>
      <span class="site-footer__tagline">Technology strategy for community transportation</span>
      <span class="site-footer__copyright">&copy; {{ 'now' | date: '%Y' }} {{ site.name }}. All rights reserved.</span>
    </div>
    <div class="site-footer__links">
      <nav class="site-footer__nav" aria-label="Footer navigation">
        {% for link in site.data.navigation.main %}
          <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
        {% endfor %}
      </nav>
      <a href="https://www.linkedin.com/in/keviniano/">LinkedIn</a>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
  </div>
</footer>
