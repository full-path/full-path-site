- key: access-tech
  name: "Access Tech"
  url: "https://www.accesstech.net/"
  logo: /assets/images/access-tech-logo.svg
  trusted_partner: true
  about:
    - >-
      Access Tech is an Oregon-based managed IT services provider that functions as a virtual
      CIO for its clients, bridging business strategy with technology implementation. They
      bring deep expertise in security and compliance, IT strategy, cloud infrastructure, and
      connectivity — with a strong track record serving transit and non-profit organizations.
    - >-
      For transit agencies specifically, Access Tech addresses the challenge of supporting
      distributed onboard technology — cameras, radios, tablets, and other fleet devices —
      without requiring agencies to hire dedicated IT staff. Their transit work includes help
      desk and field technician support, device inventory and documentation, vendor
      management, and procurement assistance. They have documented results for rural Oregon
      transit clients including significant reductions in repair time and maintenance costs.
  relationship:
    - >-
      Access Tech and Full Path have a long term strategic partnership to address small transit's
      need for a sustainable approach for maintaining transit technology using managed services,
      resulting in several agencies in Oregon using Access's services and enjoying increased
      system reliability.
    - >-
      Access Tech also assisted on the
      <a href="https://n-catt.org/resources/technology-readiness-assessment/">Technology
      Readiness and Resilience Assessment Tool</a>, published through the National Center for
      Applied Transit Technology (N-CATT), contributing managed IT expertise to the project's
      organizational resilience and cybersecurity dimensions.

