- key: garnet
  name: "Garnet Consulting"
  url: "https://www.garnetconsultingpdx.com/"
  logo: /assets/images/garnet-logo.png
  trusted_partner: true
  about:
    - >-
      Garnet Consulting is a certified DBE, ESB, and women-owned business providing transit
      technology, operations, and software consulting for rural, small urban, and intercity
      agencies. Their services span custom software development, technical strategy,
      procurement support, and expertise in open data standards including GTFS and GTFS-Flex.
  relationship:
    - >-
      Garnet is Full Path's software development partner for RideSheet and has teamed
      with Full Path on numerous other projects, delivering exceptional
      project management and transit technology expertise to clients.

