  year: "2025"
  type: whitepaper
  publisher: "National Center for Applied Transit Technology (N-CATT)"

- title: "Technology Readiness and Resilience Assessment Tool"
  description: "An online self-assessment for transit agencies rating readiness across five dimensions: Contract Management & Organization, Systems & Culture, Performance Measurement, Organizational Resilience, and Cybersecurity. Uses a CMMI-based maturity model."
  url: "https://n-catt.org/resources/technology-readiness-assessment/"
  year: "2024"
  type: tool
  publisher: "National Center for Applied Transit Technology (N-CATT)"

