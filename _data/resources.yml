# Shared resources shown in "Related Resources" sections at the bottom of
# tool, project, and blog post pages.
#
# Reference from a page via front matter:  resources: [key-one, key-two]
# Cards render in the order the page lists them.
#
# - key: unique-slug
#   name: "Resource name"
#   year: 2026
#   type: "PDF"              # PDF | Video | Webinar | Web page | Slides ...
#   url: "https://..."       # where the name and thumbnail link to
#   thumbnail: /assets/images/resources/slug.png   # optional; type placeholder if absent
#   description: "One or two sentences."

- key: gtfs-eligibilities-repo
  name: "GTFS-Eligibilities"
  year: 2021
  type: "Repository"
  url: "https://github.com/ODOT-PTS/gtfs-eligibilities"
  description: "Draft specification for a GTFS extension defining who can use a transit service — covering age constraints, disability categories, veteran status, trip purposes, and eligibility verification."

- key: gtfs-capabilities-repo
  name: "GTFS-Capabilities"
  year: 2021
  type: "Repository"
  url: "https://github.com/full-path/gtfs-capabilities"
  description: "Draft specification for a GTFS extension describing what a transit service can provide beyond the ambulatory baseline — service levels, lift and ramp specifications, mobility device space, and driver training."

- key: gtfs-eligibilities-capabilities
  name: "GTFS Extensions for Eligibilities and Capabilities: End-of-Project Webinar"
  year: 2021
  type: "Slides"
  url: "/assets/downloads/gtfs-eligibilities-capabilities.pdf"
  thumbnail: /assets/images/resources/gtfs-eligibilities-capabilities.jpg
  description: "Slide deck from the August 2021 end-of-project webinar, covering the motivation for the extensions, the technical proposals, and next steps for adoption."

- key: readiness-assessment
  name: "Technology Readiness and Resilience Assessment Tool"
  year: 2024
  type: "Web page"
  url: "https://n-catt.org/resources/technology-readiness-assessment/"
  thumbnail: /assets/images/resources/readiness-assessment.jpg
  description: "Free online self-assessment published by N-CATT. Rates your agency across five dimensions using a CMMI-based maturity model and produces a profile for prioritizing capacity-building work."

- key: framework-web
  name: "A Framework for Making Successful Technology Decisions"
