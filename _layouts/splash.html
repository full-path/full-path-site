---
layout: default
---
{% if page.header.overlay_image %}
<div class="splash-hero" style="background-image: url('{{ page.header.overlay_image | relative_url }}');">
  <div class="splash-hero__overlay" style="background: {{ page.header.overlay_filter | default: 'rgba(112, 66, 20, 0.5)' }};">
    <div class="splash-hero__content">
      {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
      {% if page.excerpt %}<p class="splash-hero__excerpt">{{ page.excerpt }}</p>{% endif %}
      {% if page.header.cta_url %}
      <div class="splash-hero__cta">
        <a href="{{ page.header.cta_url | relative_url }}" class="btn btn--white">{{ page.header.cta_label | default: 'Learn more' }}</a>
      </div>
      {% endif %}
    </div>
  </div>
</div>
{% endif %}
<div class="page-content">
  {{ content }}
</div>
